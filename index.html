    <title>PolarGrid</title>
    <meta name="description" content="White borders and photo collages in high quality, 100% offline." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional (not swap): with swap, the fallback system font
         paints first and then gets replaced by Syne/Jost once they load —
         since the two have different line-heights, that swap reflows the
         Toolbar's height and visibly shifts everything below it down by a
         few px right after the screen has already appeared. optional
         either has the real font ready in time for the first paint or
         sticks with the fallback for that load — no swap, no shift. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700&family=Jost:wght@300;400;500&display=optional" />
    <!-- Must match the app's real background (every screen is bg-ink-900,
         #141e30) — in Safari (non-installed mode) this tints the toolbar/
         app-switcher card, so a value that doesn't match the app's
         background creates a visible color stripe along the top edge. -->
    <meta name="theme-color" content="#141e30" />

    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black-translucent": the app has a dark background (#141e30) on
         every screen, so we let the content extend under the status bar
         with white text/icons — readable against the dark background.
         Each screen already reserves that space on its own via
         `pt-[env(safe-area-inset-top)]` (Toolbar/HomeScreen). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PolarGrid" />

    <!-- Immediate background before CSS loads: if the system is in light
         mode, Safari can paint the first frame with a default white
         background (undeclared color-scheme) and produce a light flash
         along the top/bottom edge before the app's petrol blue applies. -->
    <style>
      html, body { background-color: #141e30; }

      /* Boot splash: shown instantly (no JS needed) so cold starts never show
         a bare dark screen while the bundle parses/executes. App.tsx renders
         a pixel-identical logo on top of this on first paint, then flies it
         into place over HomeScreen — see the `boot` logic there — so there's
         no flash when React takes over from this static markup. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #141e30;
      }
    </style>
