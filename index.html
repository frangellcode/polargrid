<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>PolarGrid</title>
    <meta name="description" content="White borders and photo collages in high quality, 100% offline." />
    <!-- Must match the app's real background (every screen is bg-ink-900,
         #141e30) — in Safari (non-installed mode) this tints the toolbar/
         app-switcher card, so a value that doesn't match the app's
         background creates a visible color stripe along the top edge. -->
    <meta name="theme-color" content="#141e30" />

    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black-translucent": the app has a dark background (#141e30) on
         every screen, so we let the content extend under the status bar
         with white text/icons — readable against the dark background.
         Each screen already reserves that space on its own via
         `pt-[env(safe-area-inset-top)]` (Toolbar/HomeScreen). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PolarGrid" />

    <!-- Immediate background before CSS loads: if the system is in light
         mode, Safari can paint the first frame with a default white
         background (undeclared color-scheme) and produce a light flash
         along the top/bottom edge before the app's petrol blue applies. -->
    <style>
      html, body { background-color: #141e30; }

      /* Boot splash: shown instantly (no JS needed) so cold starts never show
         a bare dark screen while the bundle parses/executes.

         It lives OUTSIDE #root on purpose, so React's createRoot does not
         clear it on mount — this element stays on screen for the whole boot
         hold and App.tsx removes it itself, at the exact frame the logo
         starts moving. That timing is the point: React's logo and this one
         are never both stationary on screen at the same moment, so nothing
         can be compared and nothing can be seen to twitch. See the boot
         sequence in App.tsx for the full reasoning.

         z-index keeps it over the app while it is up; the opaque background
         means HomeScreen renders underneath completely hidden. */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #141e30;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BRPxdnMg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CUhxDotf.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <!-- 62 must match HOME_LOGO_SIZE (HomeScreen.tsx). App.tsx measures THIS
         element's rect and pins HomeScreen's logo onto it, so the sizes have
         to agree or the handoff resizes. -->
    <div id="boot-splash" class="boot-splash" aria-hidden="true">
        <svg width="62" height="62" viewBox="0 0 200 200" role="img" aria-label="PolarGrid">
          <rect x="0" y="0" width="200" height="200" rx="46" fill="#141e30" />
          <rect x="58" y="41" width="42" height="14" rx="4" fill="#4E5058" />
          <rect x="34" y="50" width="132" height="66" rx="12" fill="#D8D9DC" />
          <path d="M46 50h-0a12 12 0 0 0-12 12v54h10V62a12 12 0 0 1 12-12z" fill="#C4C5C9" />
          <rect x="34" y="98" width="132" height="4" fill="#FFE88A" />
          <rect x="34" y="102" width="132" height="4" fill="#FD5E95" />
          <rect x="34" y="106" width="132" height="4" fill="#45CAE0" />
          <circle cx="100" cy="75" r="22" fill="#909296" />
          <circle cx="100" cy="75" r="17" fill="#64666D" />
          <circle cx="100" cy="75" r="10.5" fill="#3F4149" />
          <circle cx="105.5" cy="69.5" r="4" fill="#BDBDC0" />
          <circle cx="56" cy="66" r="7.5" fill="#D14D7B" />
          <circle cx="56" cy="66" r="4.8" fill="#FD5E95" />
          <rect x="48" y="80" width="18" height="3.5" rx="1.75" fill="#9A9CA2" />
          <rect x="48" y="87" width="18" height="3.5" rx="1.75" fill="#9A9CA2" />
          <rect x="133" y="59" width="22" height="17" rx="3.5" fill="#7A7C82" />
          <rect x="136.5" y="62.5" width="15" height="10" rx="1.5" fill="#E9E9EA" />
          <path d="M141 72.5l7-10h3.5l-7 10z" fill="#BDBDC0" />
          <rect x="30" y="110" width="140" height="34" rx="10" fill="#4E5058" />
          <path d="M30 134v0a10 10 0 0 0 10 10h120a10 10 0 0 0 10-10v0z" fill="#383A43" />
          <rect x="60" y="123" width="80" height="7" rx="3.5" fill="#2A2C33" />
          <rect x="67" y="127" width="66" height="42" rx="3" fill="#F2F2F3" />

          <rect x="73" y="148" width="26" height="13" rx="1.5" fill="#FD5E95" />
          <rect x="101" y="148" width="26" height="13" rx="1.5" fill="#8FD9B6" />
      </svg>
    </div>
  </body>
</html>
